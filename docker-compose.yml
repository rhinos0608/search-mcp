# search-mcp full-stack deployment
#
# One-command setup:
#   docker compose up -d
#
# Services:
#   - search-mcp: the MCP server over stdio/SSE
#   - embedding-sidecar: text embedding inference
#   - crawl4ai: headless browser for web crawling
#   - searxng: privacy-first metasearch engine
#   - rag-anything-bridge: multimodal document extraction (PDF, Office, OCR)
#
# The MCP server connects via stdio transport by default.
# For SSE mode, expose port 8050 and configure clients accordingly.

services:
  search-mcp:
    build: .
    ports:
      - '8050:8050'
    environment:
      # Embedding provider (sidecar | ollama | transformers)
      - EMBEDDING_PROVIDER=sidecar
      - EMBEDDING_SIDECAR_BASE_URL=http://embedding-sidecar:8000
      - CRAWL4AI_BASE_URL=http://crawl4ai:8050
      - SEARXNG_BASE_URL=http://searxng:8080
      - SEARCH_BACKEND=searxng
      # RAG-Anything Bridge — multimodal document extraction (PDFs, Office, OCR)
      - RAGA_ENABLED=true
      - RAGA_BRIDGE_URL=http://rag-anything-bridge:8000
      - RAGA_DEFAULT_PARSER=auto
      # Optional API keys (uncomment to enable premium backends)
      # - BRAVE_API_KEY=your_brave_key
      # - EXA_API_KEY=your_exa_key
      # - YOUTUBE_API_KEY=your_youtube_key
    depends_on:
      embedding-sidecar:
        condition: service_healthy
      crawl4ai:
        condition: service_started
      searxng:
        condition: service_started
      rag-anything-bridge:
        condition: service_started
    restart: unless-stopped
    networks:
      - search-mcp-net
    # For stdio-transport MCP clients, use stdin/stdout instead of port mapping:
    # stdin_open: true
    # tty: true

  embedding-sidecar:
    build: ./sidecar/embedding/
    ports:
      - '8001:8000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - search-mcp-net
    # For CPU-only inference (adjust for GPU):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  crawl4ai:
    image: unclecode/crawl4ai:latest
    ports:
      - '8051:8050'
    restart: unless-stopped
    networks:
      - search-mcp-net

  searxng:
    image: searxng/searxng:latest
    ports:
      - '8081:8080'
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/etc/searxng/data
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
    restart: unless-stopped
    networks:
      - search-mcp-net

  # ── RAG-Anything Bridge ────────────────────────────────────────────────
  # Multimodal document extraction for PDFs, Office docs, scanned documents,
  # images, and other complex document types. Uses Docling, PaddleOCR, and
  # MinerU parser backends with automatic content-type detection.
  #
  # Build from the bridge service Dockerfile:
  #   docker compose build rag-anything-bridge
  # Or use pre-built image (when available):
  #   image: search-mcp/rag-anything-bridge:latest
  rag-anything-bridge:
    build:
      context: ./services/rag-anything-bridge
      dockerfile: Dockerfile
      target: runtime
    ports:
      - '8002:8000'
    environment:
      # Core configuration
      - RAGA_CACHE_DIR=/cache/rag-anything
      - RAGA_MAX_SYNC_PAGES=30
      - RAGA_MAX_SYNC_SIZE_MB=20
      - RAGA_DEFAULT_PARSER=auto
      - RAGA_REQUEST_TIMEOUT=30
      - RAGA_ASYNC_TIMEOUT=300
      # Parser configuration
      - RAGA_DOCLING_ENABLED=true
      - RAGA_PADDLEOCR_ENABLED=true
      - RAGA_MINERU_ENABLED=false
      # Async limits
      - RAGA_ASYNC_MAX_PAGES=200
      - RAGA_ASYNC_MAX_SIZE_MB=100
    volumes:
      - raga-cache:/cache
      - raga-tmp:/tmp/rag-anything
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - search-mcp-net

  # ── Optional: Redis for distributed caching (rag-anything bridge) ──────
  # Enable by running: docker compose --profile with-redis up -d
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - search-mcp-net
    profiles:
      - with-redis

volumes:
  searxng-data:
  raga-cache:
  raga-tmp:
  redis-data:

networks:
  search-mcp-net:
    driver: bridge
