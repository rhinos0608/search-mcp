# search-mcp full-stack deployment
#
# One-command setup:
#   docker compose up -d
#
# Services:
#   - search-mcp: the MCP server over stdio/SSE
#   - embedding-sidecar: text embedding inference
#   - crawl4ai: headless browser for web crawling
#   - searxng: privacy-first metasearch engine
#
# The MCP server connects via stdio transport by default.
# For SSE mode, expose port 8050 and configure clients accordingly.

services:
  search-mcp:
    build: .
    ports:
      - '8050:8050'
    environment:
      # Embedding provider (sidecar | ollama | transformers)
      - EMBEDDING_PROVIDER=sidecar
      - EMBEDDING_SIDECAR_BASE_URL=http://embedding-sidecar:8000
      - CRAWL4AI_BASE_URL=http://crawl4ai:8050
      - SEARXNG_BASE_URL=http://searxng:8080
      - SEARCH_BACKEND=searxng
      # HTTP server (leave unset to run stdio-only)
      - HTTP_PORT=8050
      - SEARCH_MCP_CONFIG_KEY=${SEARCH_MCP_CONFIG_KEY}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-12}
      - MCP_ALLOW_QUERY_KEY=${MCP_ALLOW_QUERY_KEY:-true}
      # Optional API keys (uncomment to enable premium backends)
      # - BRAVE_API_KEY=your_brave_key
      # - EXA_API_KEY=your_exa_key
      # - YOUTUBE_API_KEY=your_youtube_key
    depends_on:
      embedding-sidecar:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
      searxng:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - search-mcp-net
    # For stdio-transport MCP clients, use stdin/stdout instead of port mapping:
    # stdin_open: true
    # tty: true

  embedding-sidecar:
    build: ./sidecar/embedding/
    ports:
      - '8001:8000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - search-mcp-net
    # For CPU-only inference (adjust for GPU):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  crawl4ai:
    image: unclecode/crawl4ai:latest
    pull_policy: missing
    ports:
      - '8051:8050'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8050/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - search-mcp-net

  searxng:
    image: searxng/searxng:latest
    pull_policy: missing
    ports:
      - '8081:8080'
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/etc/searxng/data
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/ > /dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - search-mcp-net

  # ── Optional: Redis for distributed caching ────────────────────────────
  # Enable by running: docker compose --profile with-redis up -d
  redis:
    image: redis:7-alpine
    pull_policy: missing
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - search-mcp-net
    profiles:
      - with-redis

volumes:
  searxng-data:
  redis-data:

networks:
  search-mcp-net:
    driver: bridge
