# Docker Compose for RAG-Anything Bridge Development

version: '3.8'

services:
  rag-anything-bridge:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - '8000:8000'
    environment:
      # Core configuration
      - RAGA_CACHE_DIR=/cache/rag-anything
      - RAGA_MAX_SYNC_PAGES=30
      - RAGA_MAX_SYNC_SIZE_MB=20
      - RAGA_DEFAULT_PARSER=auto
      - RAGA_REQUEST_TIMEOUT=30
      - RAGA_ASYNC_TIMEOUT=300
      # Debug mode
      - RAGA_DEBUG=false
      # Parser configuration
      - RAGA_DOCLING_ENABLED=true
      - RAGA_PADDLEOCR_ENABLED=true
      - RAGA_MINERU_ENABLED=false
      # Async limits
      - RAGA_ASYNC_MAX_PAGES=200
      - RAGA_ASYNC_MAX_SIZE_MB=100
      # Quality thresholds
      - RAGA_QUALITY_MIN_TEXT=500
      - RAGA_QUALITY_MIN_RATIO=0.1
      - RAGA_QUALITY_MAX_BOILERPLATE=0.7
    volumes:
      # Cache directory
      - ./cache:/cache
      # Temporary processing directory
      - ./tmp:/tmp/rag-anything
      # Logs
      - ./logs:/app/logs
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - rag-anything-network

  # Optional: Redis for distributed caching
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - rag-anything-network
    profiles:
      - with-redis

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - '9090:9090'
    volumes:
      # NOTE: create a prometheus.yml alongside this file, or see prometheus.yml.example
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - rag-anything-network
    profiles:
      - with-monitoring

  # Optional: Grafana for dashboards
  grafana:
    # Pinned to a stable v10.x release for reproducible builds
    image: grafana/grafana:10.4.0
    ports:
      - '3000:3000'
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      # No default password — you MUST export GRAFANA_ADMIN_PASSWORD before starting
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - rag-anything-network
    profiles:
      - with-monitoring

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  rag-anything-network:
    driver: bridge
